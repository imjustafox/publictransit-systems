name: Deploy Transit Incidents Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/incidents/**"
      # The worker bundles these at deploy time; redeploy when they change.
      - "data/systems/rtd-denver/id_map.json"
      - "data/systems/rtd-denver/stations.json"
      - "data/systems/nyc-subway/stations.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    defaults:
      run:
        working-directory: workers/incidents

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PNPM
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          runtime: node@lts

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/incidents
