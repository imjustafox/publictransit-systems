name: OSM Enrichment Refresh

# Chained to the nightly GTFS refresh rather than carrying its own cron:
# change that workflow's schedule and this one follows, and the two bots can
# never race each other pushing to main.
on:
  workflow_run:
    workflows: ["Nightly GTFS Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up PNPM
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Enrich from OSM
        run: pnpm run enrich:osm

      - name: Fold the layer into generated systems
        env:
          SOUND_TRANSIT_GTFS_URL: ${{ secrets.SOUND_TRANSIT_GTFS_URL }}
          BART_GTFS_URL: ${{ secrets.BART_GTFS_URL }}
          CTA_GTFS_URL: ${{ secrets.CTA_GTFS_URL }}
          BALTIMORE_LR_GTFS_URL: ${{ secrets.BALTIMORE_LR_GTFS_URL }}
          BALTIMORE_METRO_GTFS_URL: ${{ secrets.BALTIMORE_METRO_GTFS_URL }}
          RTD_GTFS_URL: ${{ secrets.RTD_GTFS_URL }}
          WMATA_GTFS_URL: ${{ secrets.WMATA_GTFS_URL }}
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          NYC_SUBWAY_GTFS_URL: ${{ secrets.NYC_SUBWAY_GTFS_URL }}
          STUTTGART_GTFS_URL: ${{ secrets.STUTTGART_GTFS_URL }}
        run: pnpm run build:gtfs

      - name: Format refreshed data
        run: pnpm exec prettier --write "data/systems/**/*.json"

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Verify before publishing
        env:
          CI: "1"
        run: |
          pnpm run test
          pnpm run test:ci

      - name: Commit & push if changes
        run: |
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/systems)" ]]; then
            git add data/systems
            git commit -m "chore(osm): enrichment refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no data changes"
          fi

      - name: Report failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GTFS_BOT_ASSIGNEES: ${{ vars.GTFS_BOT_ASSIGNEES }}
        with:
          script: |
            const assignees = (process.env.GTFS_BOT_ASSIGNEES || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prefix = "[OSM bot] Enrichment refresh failed";

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find(
              (issue) => !issue.pull_request && issue.title.startsWith(prefix),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing on ${today}.\n\nLatest run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${prefix} (${today})`,
                body: `OSM enrichment workflow failed.\n\nRun: ${runUrl}`,
                assignees,
              });
            }

      - name: Close failure issue on recovery
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prefix = "[OSM bot] Enrichment refresh failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const stale = open.filter(
              (issue) => !issue.pull_request && issue.title.startsWith(prefix),
            );

            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `OSM refresh is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
