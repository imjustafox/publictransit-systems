name: Accessibility

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.*"
      - "data/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.*"
      - "data/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          runtime: node@lts

      - name: Install Playwright Browser
        run: pnpm exec playwright install chromium

      - name: Run Accessibility Audit
        run: pnpm run test:ci
