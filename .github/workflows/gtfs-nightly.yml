name: Nightly GTFS Refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          runtime: node@lts

      - name: Build GTFS data
        env:
          SOUND_TRANSIT_GTFS_URL: ${{ secrets.SOUND_TRANSIT_GTFS_URL }}
          BART_GTFS_URL: ${{ secrets.BART_GTFS_URL }}
          CTA_GTFS_URL: ${{ secrets.CTA_GTFS_URL }}
          BALTIMORE_LR_GTFS_URL: ${{ secrets.BALTIMORE_LR_GTFS_URL }}
          BALTIMORE_METRO_GTFS_URL: ${{ secrets.BALTIMORE_METRO_GTFS_URL }}
          RTD_GTFS_URL: ${{ secrets.RTD_GTFS_URL }}
          WMATA_GTFS_URL: ${{ secrets.WMATA_GTFS_URL }}
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          NYC_SUBWAY_GTFS_URL: ${{ secrets.NYC_SUBWAY_GTFS_URL }}
          # STUTTGART_GTFS_URL is deliberately absent: the gtfs.de source is a
          # Germany-wide feed (2GB of stop_times) that the in-memory parser
          # can't chew in CI. A missing secret makes the processor skip the
          # system cleanly, so Stuttgart stays a manual local refresh until the
          # parser streams or a pre-filtered feed exists.
        run: pnpm run build:gtfs

      - name: Format refreshed data
        run: pnpm exec prettier --write "data/systems/**/*.json"

      - name: Verify before publishing
        env:
          CI: "1"
        run: |
          pnpm run test
          pnpm run test:ci

      - name: Commit & push if changes
        run: |
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/systems)" ]]; then
            git add data/systems
            git commit -m "chore(gtfs): nightly data refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no data changes"
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GTFS_BOT_ASSIGNEES: ${{ vars.GTFS_BOT_ASSIGNEES }}
        with:
          script: |
            const assignees = (process.env.GTFS_BOT_ASSIGNEES || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[GTFS bot] Nightly run failed (${today})`,
              body: `Nightly GTFS build workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignees,
            });
